<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Eye | Pressure Cooker Poetry</title><meta name="robots" content="noindex"><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080911;color:#efebd9;font-family:Georgia,serif;min-height:100svh;display:grid;place-items:center;padding:20px;background-image:radial-gradient(circle at 50% 40%,#28213e,#080911 65%)}main{text-align:center;max-width:750px}.eye{display:block;margin:auto auto 23px;width:min(50vw,220px);height:min(30vw,130px);border:12px solid #d5c7f6;border-radius:65% 5% 65% 5%;transform:rotate(45deg);position:relative;animation:stare 7s ease-in-out infinite}.eye:after{content:"";width:60px;height:60px;border-radius:50%;background:#f07cab;box-shadow:inset 0 0 0 18px #1e1730;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}.kicker{font:700 13px Courier,monospace;letter-spacing:.22em;text-transform:uppercase;color:#c4b4e5}h1{font-size:clamp(48px,8vw,98px);line-height:.92;margin:20px 0;letter-spacing:-.055em}p{font-size:clamp(18px,2.3vw,26px);line-height:1.4}nav{display:flex;gap:15px;justify-content:center;flex-wrap:wrap;margin-top:32px}a{padding:13px 18px;border:1px solid #d5c7f6;color:#f4e9ff;text-decoration:none;font:700 12px Courier,monospace;text-transform:uppercase}a:hover,a:focus-visible{background:#d5c7f6;color:#080911}@keyframes stare{50%{transform:rotate(45deg) scale(.85)}}@media(prefers-reduced-motion:reduce){.eye{animation:none}}</style></head><body><main><span class="eye" aria-hidden="true"></span><div class="kicker">Department Zero / Unlisted Entrance</div><h1>YOU FOUND<br>THE MARGIN.</h1><p>Not every door advertises itself. Some are waiting to be noticed.</p><nav><a href="/brain-candy/">Enter Brain Candies ↗</a><a href="/">Start another edition ↗</a></nav></main></body></html>
