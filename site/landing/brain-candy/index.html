 tiny faces reacts live. Then the other side: spot the crime in five charts against the clock."],reveal:"The honest chart slides in under yours, at full scale, same data.",learn:"Truncated axes, cherry-picked ranges, dual axes and area tricks. Darrell Huff, How to Lie with Statistics (1954), plus the modern checklist: start at zero for bars, show the whole range, label the source.",feel:"The axis snaps like a ruler; the faces gasp.",wrappers:"One for each kind of chart crime you catch."},{id:"but-wait",num:"09",name:"But Wait, There’s More",tag:"An infomercial you can take apart while it sells to you.",color:"#ffd23f",play:["A fake late-night product (the Thought-O-Matic, a gadget that thinks for you) runs on a loop with a countdown clock.","Hit the brakes every time it pulls a trick: fake scarcity, fake discount, fake authority, the free gift, the countdown.","Too slow and you “buy” it: the order form fills itself in."],reveal:"The commercial replays with every trick stamped on screen and its real-world name.",learn:"Scarcity, anchoring prices, urgency and social proof as sales techniques, with the consumer-protection rules about fake “was” prices. Ties the site’s fake-abundance joke to the real thing.",feel:"Studio-audience applause, a cash-register on every fall, a siren on the countdown.",wrappers:"One per sales trick braked."},{id:"telephone",num:"10",name:"Meme Telephone",tag:"Pass a fact through ten sharers. See what comes out.",color:"#c86bff",play:["A true sentence enters a line of ten cartoon sharers. Each one changes it a little: drops a number, adds an emoji, swaps a word, crops the context.","You can stop the line at any point and fix the sentence, but every fix costs time.","Score: how close the tenth version is to the first."],reveal:"All ten versions stacked, the changes highlighted like a diff.",learn:"How rumors drift (Allport & Postman’s 1947 serial-reproduction studies) and the habit of finding the original source before sharing.",feel:"Each shar
