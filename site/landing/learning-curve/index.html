<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#191414"><title>Pressure Cooker Poetry | Sections</title>
<style>
:root{color-scheme:light;--paper:#f0e8d8;--ink:#171412;--red:#d74027;--yellow:#f2bf31}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.5}
a{color:inherit}a:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:3px}
header{background:var(--ink);color:var(--paper);border-bottom:12px solid var(--red);padding:20px max(20px,calc((100vw - 1150px)/2))}
.brand{font-weight:900;text-transform:uppercase;letter-spacing:.08em;text-decoration:none}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}nav a{border:2px solid var(--paper);padding:8px 12px;min-height:44px;text-decoration:none;font-weight:800}
nav a[aria-current]{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
main{max-width:1150px;margin:auto;padding:48px 20px 90px}
.kicker,.kind{font-family:monospace;text-transform:uppercase;font-weight:800;letter-spacing:.12em}
.kicker{color:var(--red);font-size:.9rem}
h1{font-family:Impact,'Arial Black',sans-serif;text-transform:uppercase;font-size:clamp(3.5rem,12vw,8rem);line-height:.9;letter-spacing:-.035em;margin:18px 0}
.lede{max-width:690px;font-size:clamp(1.1rem,2.5vw,1.35rem)}
.searchbar{margin:40px 0 22px;display:flex;align-items:center;gap:15px;flex-wrap:wrap}
.searchbar label{font-weight:800}.searchbar input{background:#fff;width:min(450px,100%);min-height:48px;border:3px solid var(--ink);padding:8px 12px;font:inherit}
#section-count{font-family:monospace}
#section-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:20px}
.entry{position:relative;padding:24px;background:#fffaf0;border:4px solid var(--ink);box-shadow:7px 8px 0 var(--ink);min-height:240px;overflow:hidden}
.entry:nth-child(3n+2){border-top:12px solid var(--red)}.entry:nth-child(3n){border-top:12px solid var(--yellow)}
.entry h2{font-family:Impact,'Arial Black',sans-serif;font-size:clamp(1.65rem,4vw,2.4rem);line-height:1.03;margin:12px 0 14px}
.kind{font-size:.72rem}.extracts{padding-left:18px;font-size:.88rem}.extracts li{margin:4px 0}
.go{display:inline-block;background:var(--ink);color:white;text-decoration:none;text-transform:uppercase;padding:10px 14px;font-weight:800;min-height:44px;margin-top:8px}
footer{border-top:5px solid var(--ink);padding:25px 20px;text-align:center}footer a{font-weight:800}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head>
<body><header><a class="brand" href="/">PRESSURE COOKER POETRY</a><nav aria-label="Sections"><a href="/essays/" data-section="essays">Essays</a><a href="/poems/" data-section="poems">Poems</a><a href="/learning-curve/" data-section="learning-curve">The Learning Curve</a><a href="/about/">About &amp; Mission</a><a href="/contact/">Contact</a></nav></header>
<main><div id="section-kicker" class="kicker"></div><h1 id="section-title"></h1><p class="lede" id="section-intro"></p>
<div class="searchbar"><label for="section-search">Find something</label><input id="section-search" type="search" placeholder="Search titles, topics, resources…" autocomplete="off"><span id="section-count" role="status"></span></div><div id="section-list"></div></main>
<footer><a href="/">Back to Pressure Cooker Poetry</a> · <span>Free minds, no admission charge.</span></footer>
<script src="../src/db.js"></script><script src="../src/sections.js"></script></body></html>
