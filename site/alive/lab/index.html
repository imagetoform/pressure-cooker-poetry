<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ALIVE LAB — Pressure Cooker Poetry</title>
<link rel="stylesheet" href="../alive.css">
<style>
  :root { --bg: #17151a; --paper: #f3eadb; --lime: #e4ef65; --hot: #ff2d6f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--paper); font: 15px/1.35 "Courier New", Courier, monospace; overscroll-behavior: none; }
  .bar { position: fixed; inset: 0 0 auto 0; z-index: 20; padding: .45rem .55rem .35rem; background: var(--bg); border-bottom: 3px solid var(--lime); }
  .row { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; }
  h1 { margin: 0 .4rem 0 0; font: 900 1.15rem/1 Impact, "Arial Black", sans-serif; letter-spacing: .03em; text-transform: uppercase; transform: rotate(-1.5deg); background: var(--paper); color: #111; padding: .12rem .35rem; }
  h1 span { color: var(--hot); }
  .bar button { font: 700 .78rem/1 "Courier New", monospace; background: var(--paper); color: #111; border: 0; padding: .5rem .6rem; cursor: pointer; box-shadow: 2px 2px 0 var(--lime); min-height: 2.2rem; }
  .drama { display: inline-flex; align-items: center; gap: .4rem; font: 700 .78rem/1 "Courier New", monospace; color: var(--paper); }
  .drama input { width: 7.5rem; accent-color: var(--lime); }
  .bar button[aria-pressed="true"] { background: var(--lime); box-shadow: 2px 2px 0 var(--paper); }
  .bar button:focus-visible, .chips button:focus-visible { outline: 3px dashed var(--lime); outline-offset: 2px; }
  .chips { display: flex; gap: .3rem; overflow-x: auto; margin-top: .4rem; padding-bottom: .25rem; scrollbar-width: thin; }
  .chips button { flex: 0 0 auto; background: transparent; color: var(--paper); border: 2px solid var(--paper); box-shadow: none; padding: .35rem .5rem; }
  .chips button[aria-pressed="true"] { background: var(--paper); color: #111; }
  .chips button small { opacity: .65; }
  .note { margin: .3rem 0 0; font-size: .72rem; opacity: .8; }
  .room { position: fixed; left: 0; right: 0; bottom: 0; top: var(--bar-h, 7.5rem); overflow: hidden; isolation: isolate;
          background: var(--ground) radial-gradient(circle at 30% 20%, rgba(255,255,255,.07), transparent 60%);
          transition: background-color .4s; }
  .room::before { content: ""; position: absolute; inset: 0; z-index: -1; opacity: .18;
          background: repeating-radial-gradient(circle at 0 0, rgba(0,0,0,.5) 0 1px, transparent 1px 4px); pointer-events: none; }
  .room.alive-lab .alive-piece { touch-action: none; }
  .tag { position: absolute; left: 0; top: 0; z-index: 2; translate: 0 -100%; background: #111; color: var(--lime); font: 700 10px/1.2 "Courier New", monospace; padding: 2px 4px; white-space: nowrap; pointer-events: none; display: none; }
  .labels .tag { display: block; }
  .hud { position: fixed; left: .5rem; bottom: .5rem; z-index: 20; background: rgba(17,17,17,.88); border: 2px solid var(--paper); padding: .4rem .5rem; font-size: .7rem; width: 12.5rem; }
  .hud summary { cursor: pointer; font-weight: 700; color: var(--lime); }
  .hud div { display: grid; grid-template-columns: 4.6rem 1fr; gap: .4rem; align-items: center; margin-top: .25rem; }
  .hud i { display: block; height: .55rem; background: var(--lime); width: 0; }
  .hint { position: fixed; left: 50%; top: 55%; z-index: 5; translate: -50% -50%; pointer-events: none; text-align: center; font: 900 clamp(1.6rem, 6vw, 3.4rem)/1 Impact, "Arial Black", sans-serif; text-transform: uppercase; color: var(--paper); text-shadow: 3px 3px 0 #111; transition: opacity .6s; }
  .hint small { display: block; font: 700 .9rem/1.3 "Courier New", monospace; text-transform: none; text-shadow: none; margin-top: .6rem; }
  .hint.gone { opacity: 0; }
  @media (prefers-reduced-motion: reduce) { .hint, .room { transition: none; } }
</style>
</head>
<body>
<header class="bar" id="bar">
  <div class="row">
    <h1>Alive <span>lab</span></h1>
    <button type="button" id="hear" aria-pressed="false">Let it hear you</button>
    <button type="button" id="song">Feed it a song</button><input type="file" id="songfile" accept="audio/*" hidden>
    <button type="button" id="tilt" aria-pressed="false" hidden>Tilt</button>
    <button type="button" id="still" aria-pressed="false">Hold still</button>
    <button type="button" id="labels" aria-pressed="false">Show behaviours</button>
    <button type="button" id="shuffle">Shuffle ↻</button>
    <label class="drama">Drama <input type="range" id="drama" min="0" max="3" step="0.1" aria-describedby="note"><output id="drama-out"></output></label>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Families in the room (pick up to 3)"></div>
  <p class="note" id="note" role="status">Sound stays on your device. Nothing is recorded, saved or sent.</p>
</header>

<main class="room alive-lab" id="room" aria-label="A room of cutouts. Drag them, type, tap, make noise."></main>
<div class="hint" id="hint" aria-hidden="true">Touch it. Drag it.<br>Type. Clap.<small>Every cutout moves the way its emotions feel.</small></div>

<details class="hud" open>
  <summary>What it feels</summary>
  <div><span>touch speed</span><i id="m-speed"></i></div>
  <div><span>typing</span><i id="m-keys"></i></div>
  <div><span>taps</span><i id="m-tap"></i></div>
  <div><span>loudness</span><i id="m-audio"></i></div>
  <div><span>bass</span><i id="m-low"></i></div>
  <div><span>treble</span><i id="m-high"></i></div>
  <div><span>energy</span><i id="m-energy"></i></div>
</details>

<script src="../cutouts.js"></script>
<script src="../alive.js"></script>
<script>
(function () {
  'use strict';
  const P = window.PCP, D = P.labData, A = P.alive;
  P.assets = D.assets;                       // alive.js looks cutouts up here
  const $ = id => document.getElementById(id);
  const room = $('room'), chips = $('chips'), say = t => { $('note').textContent = t; };
  const count = {}; D.assets.forEach(a => { count[a.family] = (count[a.family] || 0) + 1; });
  const famIds = Object.keys(D.families).sort((a, b) => (count[b] || 0) - (count[a] || 0));
  let picked = ['punk', 'memphis', 'situationism'].filter(f => count[f]);
  let seed = new URLSearchParams(location.search).get('seed') || 'lab-' + Date.now().toString(36), live = null;   // ?seed= makes a run repeatable (tests)

  famIds.forEach(id => {
    const b = document.createElement('button'); b.type = 'button'; b.dataset.id = id;
    b.innerHTML = D.families[id].name + ' <small>' + (count[id] || 0) + '</small>';
    b.disabled = !count[id];
    b.addEventListener('click', () => {
      picked = picked.includes(id) ? picked.filter(f => f !== id) : picked.concat(id).slice(-3);
      build();
    });
    chips.append(b);
  });

  function rnd(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return () => { h = (h + 0x6D2B79F5) | 0; let t = Math.imul(h ^ (h >>> 15), 1 | h); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  function build() {
    chips.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(picked.includes(b.dataset.id))));
    if (live) live.detach();
    room.replaceChildren();
    const fams = picked.length ? picked : famIds.filter(f => count[f]).slice(0, 3);
    const c = fams.map(f => D.families[f].colors).flat();
    room.style.setProperty('--ground', c[1] || c[0] || '#d4251c');
    room.style.setProperty('--ink', c[0] || '#111');
    room.style.setProperty('--accent', c[2] || '#e4ef65');
    // Up to 14 cutouts, taking turns between the picked families, order set by the seed.
    const R = rnd(seed + fams.join());
    const pools = fams.map(f => D.assets.filter(a => a.family === f).map(a => [R(), a.id]).sort().map(x => x[1]));
    const ids = []; for (let i = 0; ids.length < 14 && pools.some(p => p.length); i++) { const p = pools[i % pools.length]; if (p.length) ids.push(p.shift()); }
    live = A.attach(room, { assets: ids, seed: seed + fams.join(), maxScraps: 14, scatter: 'free' });
    const byId = {}; D.assets.forEach(a => { byId[a.id] = a; });
    room.querySelectorAll('.alive-scrap').forEach(w => {
      const img = w.querySelector('img'), a = byId[img.getAttribute('src').split('/').pop().replace(/\.\w+$/, '')];
      if (!a) return;
      const t = document.createElement('b'); t.className = 'tag';
      t.textContent = img.dataset.verb + ' · ' + a.emo.join(', ');
      w.append(t);
    });
    say(fams.map(f => D.families[f].name).join(' + ') + ': ' + ids.length + ' cutouts. Drag, type, tap. Escape wipes letters.');
  }

  function fitBar() { document.documentElement.style.setProperty('--bar-h', $('bar').offsetHeight + 'px'); }
  addEventListener('resize', fitBar); fitBar();

  // Controls
  $('still').setAttribute('aria-pressed', String(A.isStill()));
  // Drama: how hard music hits (lab-only; the chosen number gets baked into alive.js as A.drama).
  const dr = $('drama'), dro = $('drama-out');
  dr.value = A.drama; dro.textContent = Number(A.drama).toFixed(1);
  dr.addEventListener('input', () => { A.setDrama(dr.value); dro.textContent = Number(dr.value).toFixed(1); });
  $('still').addEventListener('click', () => { const on = !A.isStill(); A.still(on); $('still').setAttribute('aria-pressed', String(on)); });
  $('labels').addEventListener('click', e => { const on = room.classList.toggle('labels'); e.currentTarget.setAttribute('aria-pressed', String(on)); });
  $('shuffle').addEventListener('click', () => { seed = 'lab-' + Math.random().toString(36).slice(2, 8); build(); });
  $('hear').addEventListener('click', async e => {
    const b = e.currentTarget;
    if (A.signals.hearing) { A.deafen(); b.setAttribute('aria-pressed', 'false'); b.textContent = 'Let it hear you'; say('Stopped listening.'); return; }
    try { await A.listen(); b.setAttribute('aria-pressed', 'true'); b.textContent = 'Stop listening'; say('Listening. Nothing is recorded, saved or sent. Clap, hum, play music.'); }
    catch (err) { say('Can’t use the microphone here. Try “Feed it a song” instead: pick any audio file.'); }
  });
  $('song').addEventListener('click', () => { if (A.signals.hearing) { A.deafen(); $('hear').setAttribute('aria-pressed', 'false'); $('hear').textContent = 'Let it hear you'; say('Stopped.'); return; } $('songfile').click(); });
  $('songfile').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    try { await A.feed(f); say('Playing ' + f.name + '. The room hears it. Nothing leaves your device.'); }
    catch (err) { say('Couldn’t play that file.'); }
    e.target.value = '';
  });
  if (window.DeviceOrientationEvent && matchMedia('(pointer: coarse)').matches) {
    $('tilt').hidden = false;
    $('tilt').addEventListener('click', async e => { try { await A.tilt(); e.currentTarget.setAttribute('aria-pressed', 'true'); say('Tilt your phone.'); } catch (err) { say('Tilt isn’t available here.'); } });
  }

  // Meters + hint
  const m = k => $('m-' + k), hint = $('hint');
  A.onChange(S => {
    m('speed').style.width = S.speed * 100 + '%'; m('keys').style.width = S.keys * 100 + '%'; m('tap').style.width = S.tap * 100 + '%';
    m('audio').style.width = S.audio * 100 + '%'; m('low').style.width = S.low * 100 + '%'; m('high').style.width = S.high * 100 + '%';
    m('energy').style.width = S.energy * 100 + '%';
    if (S.energy > 0.05) hint.classList.add('gone');
  });
  build();
})();
</script>
</body>
</html>
