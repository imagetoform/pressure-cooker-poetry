name: Site build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Rebuild the site
        run: python site/tools/build.py
      - name: Check committed deploy files
        run: git diff --exit-code -- site/dist
      - name: Assemble the complete public site
        run: python site/tools/assemble.py
      - name: Install browser test runner
        run: npm install --no-save playwright@1.62.1 && npx playwright install --with-deps chromium
      - name: Test desktop and mobile flows
        run: |
          python -m http.server 8765 --directory site/public > /tmp/pcp-http.log 2>&1 &
          node site/tests/visual-flow.cjs
      - name: Upload review build and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-kitchen-review
          path: |
            site/public
            shots
