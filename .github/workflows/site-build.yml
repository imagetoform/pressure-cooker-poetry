name: Site build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the site
        run: python site/tools/build.py
      - name: Build is identical on a second run
        run: |
          (cd site/public && find . -type f | sort | xargs sha256sum) > /tmp/one.txt
          python site/tools/build.py
          (cd site/public && find . -type f | sort | xargs sha256sum) | diff /tmp/one.txt -
      - name: Install browser test runner
        run: npm install --no-save playwright@1.62.1 && npx playwright install --with-deps chromium
      - name: Test every page, the cutup sandbox, the alive engine and Brain Candy
        run: |
          python -m http.server 8765 --directory site/public > /tmp/pcp-http.log 2>&1 &
          sleep 1
          node site/tests/site.cjs
          node site/tests/alive.cjs
          node site/tests/spin-cycle.cjs
          node site/tests/cutup.cjs
      - name: Upload the review build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-review
          path: |
            site/public
            shots
