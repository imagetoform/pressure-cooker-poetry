name: Pressroom bulk harvest (review only)
on:
  push:
    branches:
      - pressroom/bulk-harvest-pipeline
    paths:
      - tools/cutouts/bulk_harvest.py
      - .github/workflows/pressroom-bulk.yml
  workflow_dispatch:
    inputs:
      target:
        description: Number of actual PNG cutouts to produce (1-300)
        required: true
        default: '200'
      vision:
        description: Image-based tag classification (requires OpenRouter key)
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: pressroom-bulk-harvest
  cancel-in-progress: false
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing image/cutout dependencies
        run: pip install -r tools/cutouts/requirements.txt
      - name: Harvest actual cutouts
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TARGET: ${{ inputs.target || '200' }}
          VISION: ${{ inputs.vision || 'false' }}
        run: |
          args=(--target "$TARGET" --max-attempts 900 --per-query 20 --pages 3)
          if [ "$VISION" = "true" ]; then args+=(--vision); fi
          python tools/cutouts/bulk_harvest.py "${args[@]}"
      - name: Count and verify generated images
        run: |
          python - <<'PY'
          import json,pathlib,sys
          base=pathlib.Path('library/cutouts/bulk')
          manifest=json.loads((base/'manifest.json').read_text())
          missing=[x['file'] for x in manifest if not pathlib.Path(x['file']).is_file()]
          if missing:sys.exit('Missing PNG files: '+', '.join(missing[:20]))
          print('Verified',len(manifest),'manifest entries with real files')
          PY
      - name: Commit cutouts to review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add library/cutouts/bulk
          if git diff --cached --quiet; then echo 'No new cutouts'; exit 0; fi
          git commit -m "assets: harvested and tagged review-only museum cutouts"
          git push origin HEAD:pressroom/bulk-harvest-pipeline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pressroom-bulk-report
          path: library/cutouts/bulk/last-run.json
          if-no-files-found: ignore
