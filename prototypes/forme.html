}

html, body { margin: 0; background: var(--chrome); color: var(--text); }
body { font-family: var(--f-mono); overflow-x: hidden; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--hot); outline-offset: 2px; }

.case-body { overflow-y: auto; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 1rem max(16px, env(safe-area-inset-left, 0px)); }
.decks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-left: 1px solid #333; border-top: 1px solid #333; margin-top: 1rem; }

@media (max-width: 760px) {

}
@media (prefers-reduced-motion: reduce) {

<script type="text/plain" id="corpus" data-source="sample">
=BOOK arsonist | The Arsonist's Gospels | after Vallejo · Lorca · Baraka · Cesaire · Rimbaud · Mayakovsky · Szymborska · Paz · Celan · Carson
=MOVE I | Genesis of the Unowned
=POEM 1 | First Mark | excerpt
That cooling
was not personal.
It was structural —
the system
maintaining its temperature
the only way systems can:
by making you
the variable
that needed adjusting.

You were never the problem.
You were the frequency
they hadn't scheduled.
=POEM 5 | What Was Always There | excerpt
It is still there.

Patient as a door.
Certain as a door.

Waiting
not for permission —

for you.
=MOVE II | The Hydra's Inventory
=POEM 7 | What the Algorithm Does | excerpt
Make the thing
that breaks the pattern.
Post nothing.
Make everything.
=BOOK stardust | The Genealogy of Stardust | after the voices of Plath · Ginsberg · Bukowski · Merwin · Rilke
=MOVE I | Before the Name
=POEM 1 | Stardust, Before the Genealogy | excerpt
I did not choose my atoms.
They were lent to me
by stars that had already spent themselves
on the whole question of existing —
=MOVE V | Genealogy
=POEM 29 | Still Here | excerpt
still here

still burning

that's enough

that is
more than enough

<script>
(() => {
'use strict';
const GRAMMAR = 'v1';
const $ = (id) => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const reduce = matchMedia('(prefers-reduced-motion: reduce)');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ================= inks and stocks ================= */
const INK = {
  black: '#111111', vermilion: '#D2431F', blue: '#1D4ED8', silver: '#A7A9AC', pink: '#FF2D95',
  oxblood: '#5E1A10', acid: '#C8F31D', orange: '#FF5A1F', cobalt: '#1B2FD6', paper: '#F4F4F0',
};
/* ================= the three decks =================
   Each deck owns a different kind of thing. Burn: ink, force and what gets cut away.
   Binder: structure. Weather: field, direction and stock. Authored placeholders: six per deck. */
const BURN = [
  { id: 'BT', name: 'Blowtorch', ds: '3 inks, hot solids, apertures', inks: ['black', 'vermilion', 'blue', 'silver'], solid: 0.42, screen: 0.12, bite: 'aperture', heat: 1 },
  { id: 'EM', name: 'Ember', ds: '1 ink, screens, incisions', inks: ['pink', 'oxblood'], solid: 0.18, screen: 0.34, bite: 'incision', heat: 0.35 },
  { id: 'CO', name: 'Coal', ds: 'black and silver, deep bites', inks: ['black', 'silver'], solid: 0.5, screen: 0.18, bite: 'notch', heat: 0.6 },
  { id: 'AC', name: 'Acid', ds: 'acid over black, incisions', inks: ['black', 'acid'], solid: 0.36, screen: 0.2, bite: 'incision', heat: 0.8 },
  { id: 'FL', name: 'Flare', ds: 'orange and cobalt overprint', inks: ['orange', 'cobalt', 'black'], solid: 0.4, screen: 0.14, bite: 'aperture', heat: 0.9 },
  { id: 'SM', name: 'Smoulder', ds: 'oxblood, slow solids', inks: ['oxblood', 'black', 'silver'], solid: 0.46, screen: 0.22, bite: 'notch', heat: 0.45 },
];
const BINDER = [
  { id: 'ST', name: 'Staple', ds: 'guillotine, 9 cells, heavy rule', cut: 'guillotine', rule: 14, cells: 9 },
  { id: 'WX', name: 'Wax', ds: 'spiral around the poem, hairline', cut: 'spiral', rule: 1, cells: 8 },
  { id: 'RV', name: 'Rivet', ds: 'lattice, many small cells', cut: 'lattice', rule: 6, cells: 26 },
  { id: 'SP', name: 'Spine', ds: 'column stack', cut: 'column', rule: 8, cells: 13 },
  { id: 'TW', name: 'Twine', ds: 'nested frames', cut: 'nested', rule: 3, cells: 20 },
  { id: 'MO', name: 'Mortar', ds: 'few cells, slab rules', cut: 'guillotine', rule: 20, cells: 5 },
];
const WEATHER = [
  { id: 'GA', name: 'Gale', ds: 'newsprint, piles right', stock: '#D9D2C2', dir: 'right', grad: 0.85, image: 0.14 },
  { id: 'FG', name: 'Fog', ds: 'black stock, centred', stock: '#191919', dir: 'center', grad: 0.15, image: 0.04 },
  { id: 'SL', name: 'Still', ds: 'white stock, even', stock: '#F4F4F0', dir: 'center', grad: 0.05, image: 0.08 },
  { id: 'SQ', name: 'Squall', ds: 'canary, piles left', stock: '#F2D43A', dir: 'left', grad: 0.75, image: 0.12 },
  { id: 'DR', name: 'Drought', ds: 'foundry lead, sinks', stock: '#A9ADB0', dir: 'down', grad: 0.6, image: 0.1 },
  { id: 'FR', name: 'Frost', ds: 'cold white, rises', stock: '#DFE6EA', dir: 'up', grad: 0.6, image: 0.06 },
];
const DECKS = [['burn', 'Burn', 'ink + removal', BURN], ['binder', 'Binder', 'structure', BINDER], ['weather', 'Weather', 'field + stock', WEATHER]];
const byId = (deck, id) => deck.find((d) => d.id === id) || deck[0];

/* ================= determinism =================
   recipe -> independent sub-seeds per hidden dimension, so changing Weather never
   reshuffles Binder's cuts. */
function sfc32(a, b, c, d) {
  return () => { a |= 0; b |= 0; c |= 0; d |= 0; const t = (((a + b) | 0) + d) | 0; d = (d + 1) | 0; a = b ^ (b >>> 9); b = (c + (c << 3)) | 0; c = (c << 21) | (c >>> 11); c = (c + t) | 0; return (t >>> 0) / 4294967296; };
}
function seeded(str) {
  const h = (salt) => { let x = 2166136261 >>> 0; for (const ch of salt + str) { x ^= ch.charCodeAt(0); x = Math.imul(x, 16777619); } return x >>> 0; };
  const r = sfc32(h('a'), h('b'), h('c'), h('d')); for (let i = 0; i < 12; i++) r(); return r;
}
function sub(rc, dim) {
  const k = {
    cut: [rc.binder, rc.P, rc.E, rc.poem],
    field: [rc.weather, rc.poem],
    fill: [rc.burn, rc.weather, rc.E, rc.poem],
    type: [rc.burn, rc.binder, rc.poem, rc.P],
  }[dim];
  return seeded(GRAMMAR + '|' + dim + '|' + k.join('|'));
}
const recipeCode = (rc) => `RECIPE ${GRAMMAR}·${rc.burn}${rc.binder}${rc.weather} · ${byId(BURN, rc.burn).name}+${byId(BINDER, rc.binder).name}+${byId(WEATHER, rc.weather).name} · P${rc.P} E${rc.E}`.toUpperCase();

/* ================= corpus ================= */
function parseCorpus(src) {
  const books = []; let book = null, move = null, poem = null;
  for (const raw of src.split('\n')) {
    const line = raw.replace(/\s+$/, '');
    if (line.startsWith('=BOOK ')) { const [id, title, after] = line.slice(6).split(' | '); book = { id: id.trim(), title, after: after || '', movements: [] }; books.push(book); poem = null; continue; }
    if (line.startsWith('=MOVE ')) { const [num, title] = line.slice(6).split(' | '); move = { num: num.trim(), title, poems: [] }; book.movements.push(move); poem = null; continue; }
    if (line.startsWith('=POEM ')) { const [num, title, flag] = line.slice(6).split(' | '); poem = { id: book.id + '-' + num.trim(), num: +num, title: title.trim(), excerpt: (flag || '').trim() === 'excerpt', book, move, stanzas: [[]] }; move.poems.push(poem); continue; }
    if (!poem) continue;
    if (line.trim() === '') { if (poem.stanzas[poem.stanzas.length - 1].length) poem.stanzas.push([]); } else poem.stanzas[poem.stanzas.length - 1].push(line);
  }
  const poems = [];
  for (const b of books) for (const m of b.movements) for (const p of m.poems) {
    if (!p.stanzas[p.stanzas.length - 1].length) p.stanzas.pop();
    /* fragment allow-list: whole short lines, verbatim, 1-4 words, not ending mid-thought */
    p.frags = [...new Set(p.stanzas.flat().filter((l) => { const n = l.trim().split(/\s+/).length; return n >= 1 && n <= 4 && /[A-Za-z]{3}/.test(l) && !/[—,:-]\s*$/.test(l) && l.trim() !== '*'; }).map((l) => l.trim()))];
    poems.push(p);
  }
  return { books, poems };
}

/* ================= contrast ================= */
function lum(hex) { const c = hex.replace('#', ''); const v = [0, 2, 4].map((i) => parseInt(c.slice(i, i + 2), 16) / 255).map((x) => (x <= 0.03928 ? x / 12.92 : ((x + 0.055) / 1.055) ** 2.4)); return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2]; }
function contrast(a, b) { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }

/* ================= the solver =================
   1. reserve the poem cell (incompressible), 2. guillotine the rest into regions,
   3. keep the largest as the giant, 4. split until the binder's cell count is met,
   biased toward the weather's wall. Pure geometry: same inputs, same tree. */
function solve(rc, W, H, pb, opt = {}) {
  const B = byId(BINDER, rc.binder), Wx = byId(WEATHER, rc.weather);
  const P = rc.P / 100, E = rc.E / 100;
  const rCut = sub(rc, 'cut'), rField = sub(rc, 'field');
  const k = opt.scale || 1;
  const R = Math.max(1, Math.round(B.rule * (0.55 + P * 0.9) * k));
  const strip = opt.mini ? 0 : 26;
  const Hc = H - strip;
  const minC = opt.mini ? 2 : Math.max(26, R * 3);
  const mobile = !opt.mini ? W < 700 : !!opt.mobile;
  const regions = [];
  let poem;
  if (mobile) {
    const s = Math.round(clamp(W * 0.11, 30 * k, 52 * k));
    const band = Math.round(64 * k);
    regions.push({ x: 0, y: 0, w: s, h: Hc, spine: 'L' }, { x: W - s, y: 0, w: s, h: Hc, spine: 'R' });
    regions.push({ x: s, y: 0, w: W - 2 * s, h: band, band: true });
    poem = { x: s, y: band, w: W - 2 * s, h: pb.h };
    const rest = Hc - band - pb.h;
    if (rest > 0) regions.push({ x: s, y: band + pb.h, w: W - 2 * s, h: rest });
  } else {
    let pw = Math.min(pb.w, W - 2 * minC), ph = pb.h;
    const fx = W - pw, fy = Hc - ph;
    const r1 = rField(), r2 = rField();
    let x = { right: 0.1 + r1 * 0.2, left: 0.68 + r1 * 0.2, center: 0.42 + r1 * 0.16, up: 0.25 + r1 * 0.4, down: 0.25 + r1 * 0.4 }[Wx.dir] * fx;
    let y = { up: 0.62 + r2 * 0.25, down: 0.08 + r2 * 0.2 }[Wx.dir];
    y = (y === undefined ? 0.18 + r2 * 0.4 : y) * fy;
    x = Math.round(x); y = Math.round(y);
    if (x < minC) { pw += x; x = 0; }
    if (W - x - pw < minC) pw = W - x;
    if (y < minC) { ph += y; y = 0; }
    if (Hc - y - ph < minC) ph = Hc - y;
    poem = { x, y, w: pw, h: ph };
    const X2 = x + pw, Y2 = y + ph;
    if (B.cut === 'spiral') {
      regions.push({ x: 0, y: 0, w: X2, h: y }, { x: X2, y: 0, w: W - X2, h: Y2 }, { x, y: Y2, w: W - x, h: Hc - Y2 }, { x: 0, y, w: x, h: Hc - y });
    } else if (rCut() < 0.5) {

  host.textContent = '';

  for (const st of poem.stanzas) {
    const p = document.createElement('p');
    if (poem.stanzas.length > 3) { const gauge = document.createElement('span'); gauge.className = 'gauge'; gauge.setAttribute('aria-hidden', 'true'); gauge.textContent = String(++n).padStart(2, '0'); p.appendChild(gauge); }
    for (const line of st) { const s = document.createElement('span'); s.className = 'ln'; s.textContent = line; p.appendChild(s); }
    host.appendChild(p);
  }
}
function measurePoem(poem, W) {
  const m = $('measure-poem'); const fs = poemFont(W);
  const mat = W < 700 ? 18 : 40;
  m.innerHTML = '';
  const art = document.createElement('div'); art.className = 'ptype';
  art.style.setProperty('--mat', mat + 'px'); art.style.setProperty('--pfs', fs + 'px');
  art.innerHTML = '<div class="in"><h1></h1><p class="src"></p><div class="body"></div></div>';
  art.querySelector('h1').textContent = poem.title;
  art.querySelector('.src').textContent = srcLine(poem);
  setPoemHTML(art.querySelector('.body'), poem);
  m.appendChild(art);
  art.style.display = 'inline-block'; art.style.whiteSpace = 'nowrap';
  const natural = art.getBoundingClientRect().width;
  art.style.display = 'block'; art.style.whiteSpace = '';
  const maxW = W < 700 ? W - 2 * Math.round(clamp(W * 0.11, 30, 52)) : Math.min(W * 0.46, 36 * fs + 2 * mat);
  const w = Math.ceil(Math.min(natural + 2, maxW));
  art.style.width = w + 'px';
  const h = Math.ceil(art.getBoundingClientRect().height) + 2;
  return { w, h, fs, mat };
}
const srcLine = (poem) => `${poem.book.title} · ${poem.move.num} · No. ${poem.num}${poem.excerpt ? ' · excerpt' : ''}`;
function placePoem(L, poem, look, pb) {
  const host = $('poem');
  const ink = look.dark ? INK.paper : INK.black;
  let bg = byId(WEATHER, state.rc.weather).stock;
  if (contrast(ink, bg) < 7) bg = look.dark ? '#111111' : INK.paper; /* legibility floor: 7:1 in the poem cell */
  const i = L.R / 2;
  Object.assign(host.style, { left: (L.poem.x + i) + 'px', top: (L.poem.y + i) + 'px', width: (L.poem.w - 2 * i) + 'px', height: (L.poem.h - 2 * i) + 'px', background: bg, color: ink });
  host.style.setProperty('--mat', (pb.mat - i) + 'px');
  host.style.setProperty('--pfs', pb.fs + 'px');
  $('poemTitle').textContent = poem.title;
  $('poemSrc').textContent = srcLine(poem);
  setPoemHTML($('poemBody'), poem);
}

/* ================= state, lock, proof ================= */
let CORPUS, state = { rc: { burn: 'BT', binder: 'ST', weather: 'GA', P: 70, E: 30, poem: 'arsonist-5' }, proof: false, L: null, pb: null };
function poemOf(rc) { return CORPUS.poems.find((p) => p.id === rc.poem) || CORPUS.poems[0]; }
function viewH() { return Math.max(420, innerHeight - 52); }
function layoutFor(rc, W) {
  const poem = poemOf(rc);
  const pb = measurePoem(poem, W);
  const H0 = viewH();
  const H = W < 700 ? Math.max(H0, 64 + pb.h + 220 + 26) : Math.max(H0, pb.h + 2 * Math.max(90, H0 * 0.12) + 26);
  return { L: solve(rc, W, H, pb), pb, poem };
}
function lock(animate = true) {
  const W = document.documentElement.clientWidth;
  const { L, pb, poem } = layoutFor(state.rc, W);
  state.L = L; state.pb = pb;
  const plate = $('plate');
  plate.style.height = L.H + 'px';
  $('ghost').textContent = '';
  if (state.proof) { renderProof(L, poem, pb); return; }
  const look = render(state.rc, L, poem);
  placePoem(L, poem, look, pb);
  $('poem').hidden = false;
  if (animate && !reduce.matches) {
    const svg = $('svg');
    svg.classList.add('locking'); void svg.getBoundingClientRect();
    requestAnimationFrame(() => { svg.classList.remove('locking'); setTimeout(() => { plate.classList.remove('jolt'); void plate.offsetWidth; plate.classList.add('jolt'); }, 300 + 120 * 3); });
  }
  updateSlug(poem);
  const h = `#forme-${state.rc.burn}-${state.rc.binder}-${state.rc.weather}-${state.rc.P}-${state.rc.E}-${state.rc.poem}`;
  if (location.hash !== h) { suppressHash = true; history.replaceState(null, '', h); }
  try { localStorage.setItem('forme.last.' + poem.id, JSON.stringify(state.rc)); } catch { /* per-viewer convenience only */ }
  $('live').textContent = `Locked: ${poem.title}. ${byId(BURN, state.rc.burn).name}, ${byId(BINDER, state.rc.binder).name}, ${byId(WEATHER, state.rc.weather).name}.`;
}
/* Proof is a structural state: the slicing tree collapses to a single-cell chase */
function renderProof(L, poem, pb) {
  const W = L.W, Wx = byId(WEATHER, state.rc.weather);
  const dark = lum(Wx.stock) < 0.2;
  const ink = dark ? INK.paper : INK.black;
  let stock = Wx.stock; if (contrast(ink, stock) < 7) stock = dark ? '#111111' : INK.paper;
  const svg = $('svg'); svg.textContent = '';
  const H = Math.max(viewH(), pb.h + 160);
  $('plate').style.height = H + 'px';
  svg.setAttribute('width', W); svg.setAttribute('height', H); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.appendChild(el('rect', { x: 0, y: 0, width: W, height: H, fill: stock }));
  const R = Math.max(2, Math.min(8, L.R));
  svg.appendChild(el('rect', { x: R / 2, y: R / 2, width: W - R, height: H - R, fill: 'none', stroke: ink, 'stroke-width': R }));
  const t = el('text', { x: W < 700 ? 14 : 28, y: H - 16, fill: ink, 'font-size': 11, 'letter-spacing': 1.2, opacity: 0.7 }); t.style.fontFamily = "'Space Mono', monospace"; t.textContent = recipeCode(state.rc) + ' · PROOF'; svg.appendChild(t);
  const x = W < 700 ? R : Math.round(Math.min(W * 0.16, (W - pb.w) / 2));
  const host = $('poem');
  Object.assign(host.style, { left: x + 'px', top: (W < 700 ? R : 72) + 'px', width: (W < 700 ? W - 2 * R : pb.w) + 'px', height: 'auto', background: 'transparent', color: ink });
  host.style.setProperty('--mat', pb.mat + 'px');
  host.style.setProperty('--pfs', pb.fs + 'px');
  $('poemTitle').textContent = poem.title;
  setPoemHTML($('poemBody'), poem);
}
function setProof(on) {
  state.proof = on;
  $('proof').setAttribute('aria-pressed', String(on));
  $('proof').textContent = on ? 'Re-lock' : 'Proof';
  if (on && !reduce.matches) { const s = $('svg'); s.classList.add('retract'); setTimeout(() => { s.classList.remove('retract'); lock(false); }, 300); }
  else lock(true);
}

/* ================= the Case ================= */
let suppressHash = false, pending = null;
function updateSlug(poem) { $('slug').textContent = `${recipeCode(state.rc)} · ${poem.title}`; }
function silhouette(rc) {
  const s = el('svg', { viewBox: '0 0 44 28', class: 'sil' });
  const W = 440, H = 280, pb = { w: state.pb ? Math.min(160, state.pb.w * 440 / Math.max(1, state.L.W)) : 150, h: state.pb ? Math.min(200, state.pb.h * 280 / Math.max(1, state.L.H)) : 150 };
  const L = solve(rc, W, H, pb, { mini: true, scale: 0.1 });
  s.appendChild(el('rect', { class: 'p', x: L.poem.x / 10, y: L.poem.y / 10, width: L.poem.w / 10, height: L.poem.h / 10 }));
  for (const c of L.cells) s.appendChild(el('rect', { x: c.x / 10 + 0.5, y: c.y / 10 + 0.5, width: Math.max(0, c.w / 10 - 1), height: Math.max(0, c.h / 10 - 1) }));
  return s;
}
function buildCase() {
  const host = $('decks'); host.textContent = '';
  for (const [key, label, what, deck] of DECKS) {
    const d = document.createElement('div'); d.className = 'deck';
    d.innerHTML = `<h2>${label} <span>${what}</span></h2><div class="slugs" role="group" aria-label="${label}"></div>`;
    const row = d.querySelector('.slugs');
    for (const ing of deck) {
      const b = document.createElement('button'); b.type = 'button'; b.dataset.key = key; b.dataset.id = ing.id;
      b.setAttribute('aria-pressed', String(state.rc[key] === ing.id));
      const rc = { ...state.rc, [key]: ing.id };
      b.appendChild(silhouette(rc));
      const t = document.createElement('span'); t.innerHTML = '<span class="nm"></span><span class="ds"></span>';
      t.querySelector('.nm').textContent = ing.name.toUpperCase(); t.querySelector('.ds').textContent = ing.ds;
      b.appendChild(t);
      b.addEventListener('click', () => { state.rc[key] = ing.id; state.proof = false; $('proof').setAttribute('aria-pressed', 'false'); $('proof').textContent = 'Proof'; lock(true); buildCase(); });
      b.addEventListener('pointerenter', () => ghost(rc)); b.addEventListener('focus', () => ghost(rc));
      b.addEventListener('pointerleave', clearGhost); b.addEventListener('blur', clearGhost);
      row.appendChild(b);
    }
    host.appendChild(d);
  }
}
/* hovering a slug draws the new slicing tree as ghost rules before you commit */
function ghost(rc) {
  if (!state.L || state.proof) return;
  const L = solve(rc, state.L.W, state.L.H, state.pb);
  const g = $('ghost'); g.textContent = '';
  g.setAttribute('width', L.W); g.setAttribute('height', L.H); g.setAttribute('viewBox', `0 0 ${L.W} ${L.H}`);
  const col = '#d6ff2e';
  for (const c of L.cells) g.appendChild(el('rect', { x: c.x, y: c.y, width: c.w, height: c.h, fill: 'none', stroke: col, 'stroke-width': 2, 'stroke-dasharray': '7 5' }));
  g.appendChild(el('rect', { x: L.poem.x, y: L.poem.y, width: L.poem.w, height: L.poem.h, fill: 'none', stroke: col, 'stroke-width': 3 }));
}
function clearGhost() { $('ghost').textContent = ''; }

const pIn = $('pressure'), eIn = $('entropy');
function syncDials() { pIn.value = state.rc.P; eIn.value = state.rc.E; $('pOut').textContent = state.rc.P; $('eOut').textContent = state.rc.E; }
/* the signature moment: dragging pressure squeezes the furniture's weight live; release re-locks */
pIn.addEventListener('input', () => {
  $('pOut').textContent = pIn.value;
  const w = Math.round(380 + pIn.value / 100 * 560 + 60);
  for (const t of $('svg').querySelectorAll('text')) if (t.style.fontVariationSettings) t.style.fontVariationSettings = t.style.fontVariationSettings.replace(/'wght' \d+/, `'wght' ${w}`);
});
pIn.addEventListener('change', () => { state.rc.P = +pIn.value; lock(true); buildCase(); });
eIn.addEventListener('input', () => { $('eOut').textContent = eIn.value; });
eIn.addEventListener('change', () => { state.rc.E = +eIn.value; lock(true); buildCase(); });

$('toggle').addEventListener('click', () => {
  const open = !$('case').classList.contains('open');
  $('case').classList.toggle('open', open);
  $('toggle').setAttribute('aria-expanded', String(open));
  $('toggle').textContent = open ? '▼ Close the case' : '▲ Add to the pot';
});
$('lock').addEventListener('click', () => { state.proof = false; $('proof').setAttribute('aria-pressed', 'false'); $('proof').textContent = 'Proof'; lock(true); });
$('proof').addEventListener('click', () => setProof(!state.proof));
addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea')) return;
  if (e.key === 'p' || e.key === 'P') setProof(!state.proof);
  if (e.key === 'Escape') { $('rack').hidden = true; $('rackBtn').setAttribute('aria-expanded', 'false'); }
});

/* ================= the Rack ================= */
function buildRack() {
  const host = $('rackList'); host.textContent = '';
  for (const b of CORPUS.books) {
    const h = document.createElement('h3'); h.textContent = b.title; host.appendChild(h);
    const ol = document.createElement('ol');
    for (const m of b.movements) for (const p of m.poems) {
      const li = document.createElement('li'), bt = document.createElement('button'); bt.type = 'button';
      let rc = null; try { rc = JSON.parse(localStorage.getItem('forme.last.' + p.id) || 'null'); } catch { rc = null; }
      rc = rc || { ...state.rc, poem: p.id };
      const Bu = byId(BURN, rc.burn), Wx = byId(WEATHER, rc.weather);
      const stripes = Bu.inks.map((n) => INK[n]).filter((c) => contrast(c, Wx.stock) >= 1.7);
      bt.innerHTML = '<span class="no"></span><span class="tt"></span><svg class="sliver" viewBox="0 0 90 10" preserveAspectRatio="none" aria-hidden="true"></svg>';
      bt.querySelector('.no').textContent = String(p.num).padStart(2, '0');
      bt.querySelector('.tt').textContent = p.title;
      const sv = bt.querySelector('svg');
      sv.appendChild(el('rect', { x: 0, y: 0, width: 90, height: 10, fill: Wx.stock }));
      const r = seeded(p.id + rc.burn); let x = 0;
      while (x < 90) { const w = 4 + r() * 22; const c = stripes[Math.floor(r() * stripes.length)] || '#111'; if (r() < 0.65) sv.appendChild(el('rect', { x, y: 0, width: w, height: 10, fill: c })); x += w; sv.appendChild(el('rect', { x, y: 0, width: 1, height: 10, fill: '#111' })); x += 1; }
      bt.addEventListener('click', () => { state.rc = { ...rc, poem: p.id }; $('rack').hidden = true; $('rackBtn').setAttribute('aria-expanded', 'false'); syncDials(); lock(true); buildCase(); scrollTo(0, 0); });
      li.appendChild(bt); ol.appendChild(li);
    }
    host.appendChild(ol);
  }
}
$('rackBtn').addEventListener('click', () => { const r = $('rack'); const open = r.hidden; if (open) buildRack(); r.hidden = !open; $('rackBtn').setAttribute('aria-expanded', String(open)); });

/* Session 2's three mockups, as recipes */
const PRESETS = [
  ['1 · High density', { burn: 'BT', binder: 'ST', weather: 'GA', P: 74, E: 28 }],
  ['2 · Quiet mono', { burn: 'EM', binder: 'WX', weather: 'FG', P: 35, E: 18 }],
  ['3 · Tall lattice', { burn: 'AC', binder: 'RV', weather: 'SL', P: 60, E: 40 }],
];
for (const [label, rc] of PRESETS) {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = label;
  b.addEventListener('click', () => { state.rc = { ...state.rc, ...rc }; state.proof = false; syncDials(); lock(true); buildCase(); });
  $('presets').appendChild(b);
}

function readHash() {
  const m = /^#forme-([A-Z]{2})-([A-Z]{2})-([A-Z]{2})-(\d{1,3})-(\d{1,3})-([a-z]+-\d+)$/.exec(location.hash);
  if (!m) return false;
  state.rc = { burn: m[1], binder: m[2], weather: m[3], P: clamp(+m[4], 0, 100), E: clamp(+m[5], 0, 100), poem: m[6] };
  return true;
}
addEventListener('hashchange', () => { if (suppressHash) { suppressHash = false; return; } if (readHash()) { syncDials(); lock(true); buildCase(); } });
let rz = 0, lastW = 0;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { const w = document.documentElement.clientWidth; if (w !== lastW) { lastW = w; lock(false); buildCase(); } }, 150); });

(async function boot() {
  const src = $('corpus');
  let text = src.textContent;
  if (src.dataset.source !== 'full') { try { const r = await fetch('corpus/corpus.txt', { cache: 'no-store' }); if (r.ok) { const t = await r.text(); if (t.includes('=POEM')) text = t; } } catch { /* sample */ } }
  CORPUS = parseCorpus(text);
  readHash();
  if (!CORPUS.poems.find((p) => p.id === state.rc.poem)) state.rc.poem = (CORPUS.poems.find((p) => /always there/i.test(p.title)) || CORPUS.poems[0]).id;
  /* fit-type needs real metrics, so nothing locks until the faces are in */
  const loads = ["400 20px 'Roboto Flex'", "900 20px 'Roboto Flex'", "900 20px 'Anybody'", "italic 700 20px 'Bodoni Moda'", "400 20px 'Source Serif 4'", "italic 600 20px 'Source Serif 4'", "400 11px 'Space Mono'"];
  try { await Promise.race([Promise.all(loads.map((f) => document.fonts.load(f))), new Promise((r) => setTimeout(r, 2500))]); } catch { /* fall back to system faces */ }
  await document.fonts.ready;
  lastW = document.documentElement.clientWidth;
  syncDials();
  lock(true);
  buildCase();
})();
})();
</script>
