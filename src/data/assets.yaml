- family_id: 0
  name: "Art Nouveau"
  default_mood: "Sweet Nostalgia"
  default_stats: { heat: 4, order: 6, noise: 3, weight: 4 }
  history: "Emerged in Western Europe in the 1890s as a reaction against industrial mass production and academic art. Graphic artists and architects drew from organic plant structures, Japanese woodcuts, and flowing linework to integrate fine art into daily commercial craft."
  visual_dna: [sinuous whiplash curves, stylized botanical tendrils, flattened decorative planes, ornate framing, muted organic palettes]
  palette: ["#2E4033", "#D9A05B", "#E8C8A5", "#4A6B5D", "#8C5E38"]
  type_cues: [hand-drawn display lettering, swash caps, organic serif terminals, integrated floral cartouches]
  motion_cues: [slow undulating sway, organic line draw-in, gentle iris opens, liquid morphing]
  whisper: "A subtle sage border with delicate whiplash corner flourishes and understated serif captions."
  scream: "Overwhelming golden vines, tangled Alphonse Mucha cartouches, and hyper-saturated stained-glass framing that swallows the page text."
  key_makers: ["Alphonse Mucha", "Aubrey Beardsley", "Will Bradley", "Ector Guimard", "Les Nabis"]

